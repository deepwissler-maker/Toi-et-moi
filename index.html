<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Un endroit créé juste pour toi.">
    <title>Toi &amp; Moi ♥</title>

    <!-- Typographies -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components/navigation.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/sections/hero.css">
    <link rel="stylesheet" href="css/sections/footer.css">
</head>
<body>

    <!-- ============================================
         NAVIGATION
         ============================================ -->
    <header class="nav" id="nav" aria-label="Navigation principale">
        <a href="#hero" class="nav__brand" aria-label="Retour en haut">
            Toi &amp; Moi <span class="nav__heart" aria-hidden="true">♥</span>
        </a>

        <nav class="nav__links" aria-label="Sections du site">
            <a href="#timeline" class="nav__link">Notre histoire</a>
            <a href="#letters" class="nav__link">Lettres</a>
            <a href="#counter" class="nav__link">Notre temps</a>
        </nav>
    </header>

    <!-- ============================================
         HERO
         ============================================ -->
    <section id="hero" class="section section--hero" aria-label="Accueil">

        <canvas id="skyCanvas" class="hero__canvas" aria-hidden="true"></canvas>
        <canvas id="fireworksCanvas" class="hero__fireworks" aria-hidden="true"></canvas>

        <div class="hero__glow" aria-hidden="true"></div>

        <div class="hero__content container container--sm">
            <p class="hero__eyebrow animate-on-load animate-on-load--1">Pour toi</p>

            <h1 class="hero__title animate-on-load animate-on-load--2">
                J'ai créé cet endroit<br>
                <em>juste pour toi.</em>
            </h1>

            <p class="hero__subtitle animate-on-load animate-on-load--3">
                Un petit univers à découvrir, doucement,
                au fil de notre histoire.
            </p>

            <div class="hero__actions animate-on-load animate-on-load--4">
                <button type="button" class="btn btn--primary" id="enterBtn">
                    Entrer
                </button>
            </div>
        </div>

        <div class="hero__scroll animate-on-load animate-on-load--5" aria-hidden="true">
            <span class="hero__scroll-line"></span>
        </div>
    </section>

    <!-- ============================================
         TIMELINE — Étape 5
         ============================================ -->
    <section id="timeline" class="section section--timeline" aria-label="Notre histoire">
        <div class="container">
            <!-- Contenu ajouté à l'étape 5 -->
        </div>
    </section>

    <!-- ============================================
         LETTRES — Étape 6
         ============================================ -->
    <section id="letters" class="section section--letters" aria-label="Lettres">
        <div class="container">
            <!-- Contenu ajouté à l'étape 6 -->
        </div>
    </section>

    <!-- ============================================
         COMPTEUR — Étape 7
         ============================================ -->
    <section id="counter" class="section section--counter" aria-label="Notre temps">
        <div class="container">
            <!-- Contenu ajouté à l'étape 7 -->
        </div>
    </section>

    <!-- ============================================
         FOOTER
         ============================================ -->
    <footer class="footer" aria-label="Pied de page">
        <p class="footer__text">
            Fait avec <span class="footer__heart" aria-hidden="true">♥</span>
            pour toi
        </p>
        <p class="footer__meta">
            <span id="footerYear"></span>
        </p>

        <button
            type="button"
            class="footer__sparkle"
            id="sparkleBtn"
            aria-label="Relancer un feu d'artifice"
            title="Un peu de magie ?"
        >
            ✨
        </button>
    </footer>

    <script type="module" src="js/main.js"></script>

</body>
</html>
